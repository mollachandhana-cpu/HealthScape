server.port=${PORT:8080}
server.forward-headers-strategy=framework

# TiDB Cloud / MySQL-compatible database. Set DATABASE_URL, DATABASE_USER and DATABASE_PASSWORD.
# TiDB Cloud public endpoint example:
# jdbc:mysql://<your-host>:4000/healthscape?sslMode=VERIFY_IDENTITY
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/healthscape?serverTimezone=UTC}
spring.datasource.username=${DATABASE_USER:healthscape}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Configure HS_ADMIN_USER and HS_ADMIN_PASSWORD via your environment / cloud secrets.

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=HealthScapeAI
info.app.description=Environmental health intelligence dashboard
