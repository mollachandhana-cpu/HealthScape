<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/app.css}"><title>Admin · HealthScape AI</title></head><body>
<div th:replace="~{fragments :: nav}"></div>
<div class="hero"><h1>Administration</h1><p>Create accounts for community health workers and review the audit trail.</p></div>
<main><p class="flash" th:if="${msg}" th:text="${msg}"></p>
 <section class="card"><h2 style="margin-top:0">Add user</h2><form class="tools" method="post" th:action="@{/admin/users}">
  <input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password (10+ chars)" required minlength="10">
  <select name="role"><option value="WORKER">Community health worker</option><option value="ADMIN">Administrator</option></select><button type="submit">Create</button></form>
  <ul><li th:each="u : ${users}" th:text="${u.username + ' (' + (u.role ?: 'ADMIN') + ')'}"></li></ul></section>
 <section class="card" style="overflow-x:auto"><h2 style="margin-top:0">Audit log (latest 50)</h2><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>
  <tr th:each="a : ${audit}"><td th:text="${a.created}"></td><td th:text="${a.actor}"></td><td th:text="${a.action}"></td><td th:text="${a.detail}"></td></tr></tbody></table></section>
</main></body></html>
